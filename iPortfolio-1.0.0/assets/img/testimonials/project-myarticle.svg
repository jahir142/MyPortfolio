<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b5e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff08" stroke-width="1"/>
  <!-- Search/SEO magnifier -->
  <circle cx="155" cy="165" r="40" stroke="#e74c3c" stroke-width="4" fill="none" opacity="0.8"/>
  <line x1="185" y1="195" x2="210" y2="220" stroke="#e74c3c" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Google rank bars -->
  <rect x="270" y="205" width="40" height="15" rx="3" fill="#e74c3c" opacity="0.9"/>
  <rect x="320" y="190" width="40" height="30" rx="3" fill="#f39c12" opacity="0.9"/>
  <rect x="370" y="175" width="40" height="45" rx="3" fill="#e74c3c" opacity="0.7"/>
  <rect x="420" y="155" width="40" height="65" rx="3" fill="#f39c12" opacity="0.7"/>
  <rect x="470" y="130" width="40" height="90" rx="3" fill="#e74c3c" opacity="0.8"/>
  <!-- Trending arrow -->
  <path d="M270 200 L320 185 L370 170 L420 148 L475 122" stroke="#f39c12" stroke-width="2.5" fill="none" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Rank 1 badge -->
  <circle cx="490" cy="110" r="20" fill="#f39c12" opacity="0.9"/>
  <text x="490" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a0a2e" text-anchor="middle">#1</text>
  <!-- Title -->
  <rect x="100" y="260" width="400" height="3" fill="url(#accent)" rx="2"/>
  <text x="300" y="305" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">MYARTICLE — SEO Project</text>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle">SEO · Content Marketing · Google Analytics · Digital Marketing</text>
  <!-- Top badge -->
  <rect x="225" y="30" width="150" height="26" rx="13" fill="#e74c3c" opacity="0.2"/>
  <text x="300" y="47" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">Digital Marketing · SEO</text>
</svg>
