<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="50%" style="stop-color:#1e5631"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#1cc9a2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff08" stroke-width="1"/>
  <!-- Cart icon -->
  <path d="M100 140 L120 140 L140 200 L200 200 L215 165 L130 165" stroke="#27ae60" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <circle cx="150" cy="215" r="10" fill="#27ae60"/>
  <circle cx="195" cy="215" r="10" fill="#27ae60"/>
  <!-- Produce icons -->
  <circle cx="320" cy="150" r="20" fill="#27ae60" opacity="0.7"/>
  <circle cx="370" cy="155" r="16" fill="#1cc9a2" opacity="0.7"/>
  <circle cx="410" cy="145" r="22" fill="#27ae60" opacity="0.5"/>
  <circle cx="460" cy="158" r="14" fill="#1cc9a2" opacity="0.7"/>
  <!-- AI nodes -->
  <circle cx="340" cy="210" r="5" fill="#1cc9a2"/>
  <circle cx="390" cy="200" r="5" fill="#27ae60"/>
  <circle cx="440" cy="215" r="5" fill="#1cc9a2"/>
  <circle cx="420" cy="240" r="5" fill="#27ae60"/>
  <circle cx="365" cy="245" r="5" fill="#1cc9a2"/>
  <line x1="340" y1="210" x2="390" y2="200" stroke="#27ae60" stroke-width="1.5" opacity="0.5"/>
  <line x1="390" y1="200" x2="440" y2="215" stroke="#1cc9a2" stroke-width="1.5" opacity="0.5"/>
  <line x1="440" y1="215" x2="420" y2="240" stroke="#27ae60" stroke-width="1.5" opacity="0.5"/>
  <line x1="420" y1="240" x2="365" y2="245" stroke="#1cc9a2" stroke-width="1.5" opacity="0.5"/>
  <!-- Title -->
  <rect x="100" y="260" width="400" height="3" fill="url(#accent)" rx="2"/>
  <text x="300" y="305" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Grocery System</text>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">Python · Django · AI · MySQL · REST API</text>
  <!-- Top badge -->
  <rect x="240" y="30" width="120" height="26" rx="13" fill="#27ae60" opacity="0.2"/>
  <text x="300" y="47" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Python · AI · Full Stack</text>
</svg>
